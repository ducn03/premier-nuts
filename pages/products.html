<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sản phẩm | Premier Nuts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
<div id="site-header"></div>

<main class="catalog-page">
  <section class="sec catalog-wrap">
    <div class="sec-head catalog-head">
      <div>
        <span class="detail-kicker">CHỌN MÓN HỢP VỚI NHỊP SỐNG CỦA BẠN</span>
        <h1 class="catalog-title">Những hạt nhỏ cho những ngày bận rộn.</h1>
        <p class="catalog-lead">Từ hạt chia, hạt dinh dưỡng đến ngũ cốc dễ dùng. Chọn sản phẩm bạn quan tâm, sau đó để lại thông tin để Premier Nuts xác nhận đơn.</p>
      </div>
      <a href="../index.html" class="see-all">← Quay lại</a>
    </div>
    <div class="cat-strip" aria-label="Lọc theo danh mục">
      <button class="cat-chip active" type="button" data-category="all"><span class="swatch" style="background:var(--orange)"></span>Tất cả</button>
      <button class="cat-chip" type="button" data-category="Hạt chia"><span class="swatch" style="background:var(--green)"></span>Hạt chia</button>
      <button class="cat-chip" type="button" data-category="Combo / Bộ set"><span class="swatch" style="background:#D7A65C"></span>Combo / Bộ set</button>
    </div>
    <div class="product-grid product-grid-full" id="product-list" aria-live="polite"></div>
  </section>
</main>
<div id="site-footer"></div>
<div id="site-bottom-nav"></div>

<script src="../shared/site-shell.js" defer></script>
<script src="../features/catalog/catalog.js" defer></script>
</body>
</html>
